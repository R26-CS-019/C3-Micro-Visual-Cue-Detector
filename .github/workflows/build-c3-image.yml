# Builds the C3 container image on GitHub (free) and publishes it to
# ghcr.io/r26-cs-019/c3-micro-visual-cue-detector:latest for Azure to run.
name: Build C3 container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            C3_BUILD_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/r26-cs-019/c3-micro-visual-cue-detector:latest
            ghcr.io/r26-cs-019/c3-micro-visual-cue-detector:${{ github.sha }}
